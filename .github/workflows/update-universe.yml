name: Build Investment Universe

on:
  workflow_dispatch:
  push:
    paths:
      - "config/universe_rules.json"
      - "scripts/build_universe.py"
      - ".github/workflows/update-universe.yml"
  schedule:
    - cron: "30 10 * * 1-5"

concurrency:
  group: investment-universe-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile scripts/build_universe.py
      - name: Build universe
        id: build
        continue-on-error: true
        run: python scripts/build_universe.py
      - name: Record refresh outcome
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome=os.environ.get("BUILD_OUTCOME","failure")
          status="PASS" if outcome=="success" else "FALLBACK_PREVIOUS_UNIVERSE"
          payload={
              "checked_at_utc":datetime.now(timezone.utc).isoformat(),
              "status":status,
              "build_outcome":outcome,
              "message":"Fresh universe built successfully." if outcome=="success" else "Fresh universe was incomplete or failed. Previous validated 100-stock universe files were retained where needed. Diversification rules were not relaxed.",
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/universe_refresh_status.json").write_text(json.dumps(payload,indent=2),encoding="utf-8")
          if outcome!="success":
              print("::warning::Fresh universe build failed or was incomplete. Falling back to the previously committed validated universe; diversification rules remain unchanged.")
          print(json.dumps(payload,indent=2))
          PY
      - name: Validate outputs and diversification
        run: |
          python - <<'PY'
          import json
          checks=[("Canada","data/canada_universe.json",100),("India","data/india_universe.json",100)]
          for market,path,target in checks:
              data=json.load(open(path,encoding="utf-8")); stocks=data.get("stocks",[]); count=len(stocks)
              print(f"{market}: discovered={data.get('discovered_count',0)}, eligible={data.get('eligible_count',0)}, selected={count}, target={target}")
              if count<target: raise SystemExit(f"FAIL: {market} selected only {count} stocks")
              bad={k:v for k,v in data.get("industry_counts",{}).items() if v>10}
              if bad: raise SystemExit(f"FAIL: {market} industry cap exceeded: {bad}")
              missing=[s.get('symbol') for s in stocks if not s.get('industry')]
              if missing: raise SystemExit(f"FAIL: {market} has stocks without industry classification: {missing[:10]}")
          refresh=json.load(open("reports/universe_refresh_status.json",encoding="utf-8"))
          if refresh.get("status") not in {"PASS","FALLBACK_PREVIOUS_UNIVERSE"}:
              raise SystemExit("FAIL: unknown universe refresh status")
          print(f"STATUS: {refresh.get('status')} — validated 100 + 100 with max 10 per industry")
          PY
      - name: Commit generated universe
        run: |
          git config user.name "Investment Universe"
          git config user.email "actions@github.com"
          git add data/*.json reports/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update diversified investment universe"
          git pull --rebase origin main
          git push
