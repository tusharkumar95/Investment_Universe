name: Update Small Cap Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"
  push:
    paths:
      - "scripts/build_smallcap_universe.py"
      - ".github/workflows/update-smallcap.yml"

concurrency:
  group: investment-universe-smallcap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scripts/build_smallcap_universe.py

      - name: Build small-cap universe
        run: python scripts/build_smallcap_universe.py

      - name: Validate 10 + 10
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/smallcap_universe.json'))
          assert d['markets']['Canada']['selected_count'] == 10
          assert d['markets']['India']['selected_count'] == 10
          for market in ['Canada','India']:
              stocks=d['markets'][market]['stocks']
              assert all(s.get('businessFit') == 'Operating company' for s in stocks)
              assert all(s.get('dataConfidence') is not None for s in stocks)
              counts={}
              for s in stocks:
                  industry=s.get('industry') or 'Unknown'
                  counts[industry]=counts.get(industry,0)+1
              assert max(counts.values()) <= 3
          print('Small-cap v3 validation PASS: 10 + 10, operating companies, confidence scored, industry cap <= 3')
          PY

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smallcap_universe.json
          git diff --cached --quiet && exit 0
          git commit -m "Update small-cap universe"
          git pull --rebase origin main
          git push
